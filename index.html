<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบอัปโหลดสลิป</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style> 
    body { 
      font-family: 'Kanit', sans-serif; 
      background-color: #f8fafc;
    }
    .hero-banner {
      background: linear-gradient(135deg, #0a0118 0%, #031726 50%, #06283d 100%);
    }
    .neon-text {
      color: #38ef7d;
      text-shadow: 0 0 12px rgba(56, 239, 125, 0.4);
    }
    .badge-pill {
      background-color: #ccff00;
      color: #000;
    }
    .custom-card {
      border: 2px solid #1e293b;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .custom-input-box {
      border: 2px solid #1e293b;
    }
    .btn-pink {
      background-color: #ff007a;
      border: 2px solid #1e293b;
      transition: all 0.2s ease;
    }
    .btn-pink:hover {
      background-color: #e0006c;
      transform: translateY(-1px);
    }
    .btn-pink:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <div class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

    <!-- Header Banner สไตล์ Dark Modern -->
    <div class="hero-banner rounded-3xl p-8 text-center text-white shadow-2xl relative overflow-hidden border border-slate-800">
      <div class="inline-flex items-center gap-1.5 badge-pill px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider mb-3">
        💎 FINANCIAL & SALES MANAGEMENT HUB
      </div>
      <h1 class="text-4xl md:text-5xl font-black tracking-wide mb-2 neon-text">
        THE NAIL LABS
      </h1>
      <p class="text-sm md:text-base text-slate-300 font-light max-w-lg mx-auto">
        ระบบบันทึกรายการขาย บันทึกลง Sales & Ledger พร้อมสรุปผลการจัดสรรเงินอัตโนมัติจ้ะ!
      </p>
    </div>

    <!-- Navigation Tab Simulation -->
    <div class="flex justify-center">
      <div class="bg-white border-2 border-slate-900 rounded-2xl p-1.5 flex gap-2 shadow-sm">
        <button type="button" class="px-5 py-2 rounded-xl text-xs md:text-sm font-bold text-slate-700 hover:bg-slate-100 transition flex items-center gap-2">
          📊 สรุปยอดเงิน & กราฟ
        </button>
        <button type="button" class="px-5 py-2 rounded-xl text-xs md:text-sm font-bold text-white bg-slate-900 shadow flex items-center gap-2">
          📝 บันทึกข้อมูลการขายใหม่
        </button>
      </div>
    </div>

    <!-- Form Card Container -->
    <div class="max-w-xl mx-auto bg-white rounded-3xl p-6 md:p-8 custom-card space-y-6">
      
      <!-- Card Title -->
      <div class="flex items-start justify-between border-b border-slate-100 pb-4">
        <div>
          <h2 class="text-xl md:text-2xl font-bold text-slate-900 flex items-center gap-2">
            🛒 ฟอร์มบันทึกข้อมูลการขาย
          </h2>
          <p class="text-xs text-slate-500 font-normal mt-1">
            อัปโหลดสลิปเพื่อบันทึกข้อมูลเข้า Google Sheets (ข้าม Col F อัตโนมัติจ้ะ)
          </p>
        </div>
        <div class="text-2xl">🛍️</div>
      </div>

      <!-- Form -->
      <form id="uploadForm" class="space-y-5">
        
        <label class="block text-xs font-bold text-slate-800 mb-1">
          📷 แนบรูปถ่ายสลิป / ใบสั่งซื้อ (SHOPEE, LAZADA, ฯลฯ)
        </label>

        <!-- Dropzone / Input Box -->
        <div id="dropZone" class="custom-input-box rounded-xl p-4 text-center cursor-pointer bg-white hover:bg-slate-50 transition flex items-center justify-between gap-3">
          <input type="file" id="slipInput" accept="image/*" class="hidden" required />
          
          <div id="uploadPrompt" class="flex items-center justify-between w-full">
            <span class="bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-slate-700 transition">
              เลือกไฟล์
            </span>
            <span id="fileLabel" class="text-xs text-slate-500 font-medium truncate flex-1 text-right">
              ไม่ได้เลือกไฟล์ใด
            </span>
          </div>

          <div id="previewContainer" class="hidden w-full text-center space-y-2">
            <img id="imagePreview" src="" class="max-h-60 rounded-lg mx-auto shadow border border-slate-200" />
            <p class="text-xs text-slate-400">คลิกเพื่อเปลี่ยนรูปภาพ</p>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full btn-pink text-white font-bold py-3.5 px-6 rounded-xl shadow-md text-sm md:text-base flex items-center justify-center gap-2">
          💾 บันทึกรายการลง SALES & LEDGER
        </button>
      </form>

      <!-- Status Message -->
      <div id="statusMessage" class="hidden p-4 rounded-xl text-center text-sm font-medium border-2"></div>
    </div>

  </div>

 <script>
    // ** ใส่ Web App URL ที่ได้จากการ Deploy Google Apps Script **
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzgKBZXHGRYmeYfqJPOu1zkzMlAghPYy5iHknKDR3rMxAssYwzgpVQZXMo9CPPapaEvIA/exec";

    const slipInput = document.getElementById('slipInput');
    const dropZone = document.getElementById('dropZone');
    const uploadPrompt = document.getElementById('uploadPrompt');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const uploadForm = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');
    const fileLabel = document.getElementById('fileLabel');

    dropZone.addEventListener('click', () => slipInput.click());

    slipInput.addEventListener('change', () => {
      const file = slipInput.files[0];
      if (file) {
        fileLabel.innerText = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
          imagePreview.src = e.target.result;
          uploadPrompt.classList.add('hidden');
          previewContainer.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    // --- แก้ไขจุดนี้: เปลี่ยนจาก FormData เป็น Base64 ---
    uploadForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const file = slipInput.files[0];
      if (!file) return;

      submitBtn.disabled = true;
      submitBtn.innerText = '⏳ กำลังอ่านข้อมูล OCR...';
      showStatus('กำลังบันทึกรูปและสแกนสลิป โปรดรอสักครู่...', 'bg-blue-50 text-blue-700 border-blue-200');

      const reader = new FileReader();
      reader.onload = async function(e) {
        // ดึงเฉพาะข้อมูล Base64 หลังจาก comma
        const base64Data = e.target.result.split(',')[1];
        
        try {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({
              fileData: base64Data,
              mimeType: file.type,
              fileName: file.name
            })
          });

          const result = await response.json();

          if (result.success) {
            showStatus(`✅ บันทึกสำเร็จ! ยอดเงิน: ${result.data.amount} บาท (เลขอ้างอิง: ${result.data.refNo})`, 'bg-green-50 text-green-700 border-green-200');
          } else {
            showStatus('❌ เกิดข้อผิดพลาด: ' + (result.message || 'ไม่สามารถอ่านข้อมูลได้'), 'bg-red-50 text-red-700 border-red-200');
          }
        } catch (error) {
          showStatus('❌ ส่งข้อมูลไม่สำเร็จ หรือติดปัญหา CORS/Permission', 'bg-red-50 text-red-700 border-red-200');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = '💾 บันทึกรายการลง SALES & LEDGER';
        }
      };
      
      reader.readAsDataURL(file);
    });

    function showStatus(msg, cssClass) {
      statusMessage.innerText = msg;
      statusMessage.className = `p-4 rounded-xl text-center text-sm font-medium border-2 ${cssClass}`;
      statusMessage.classList.remove('hidden');
    }
  </script>
</body>
</html>
